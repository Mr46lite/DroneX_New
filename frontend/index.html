<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroneX Command System - Advanced SAR</title>
    
    <!-- Leaflet & MapLibre GL for the Dark Map Style -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
    
    <!-- Turf.js for Spatial Grid Division -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100vw; background-color: #000; }

        /* UI Panels */
        #left-panel {
            position: absolute; top: 10px; left: 10px; bottom: 10px; width: 320px;
            background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 8px;
            z-index: 1000; display: flex; flex-direction: column; padding: 12px; color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }
        #terminal-panel {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 60%; height: 160px; background: rgba(5, 8, 17, 0.95); border: 2px solid #334155;
            border-radius: 8px; z-index: 1000; padding: 10px; color: #cbd5e1; font-family: 'Courier New', monospace;
            font-size: 12px; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .term-entry { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
        .term-time { color: #38bdf8; margin-right: 6px; }

        /* Buttons & Toggles */
        .top-bar-controls {
            position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 10px;
        }
        .btn {
            background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; padding: 8px 16px;
            border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn:hover { background: #38bdf8; color: #0f172a; }
        .btn.active { background: #f97316; border-color: #f97316; color: #fff; }

        /* Weather Panel */
        #weather-panel {
            position: absolute; top: 50px; right: 10px; width: 220px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155; border-radius: 8px; z-index: 1000; padding: 12px; color: #fff; display: none;
        }
        .weather-close { float: right; cursor: pointer; color: #ef4444; font-weight: bold; }
        .weather-opt { margin-top: 10px; }

        /* Drone List Styles */
        .drone-card {
            background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.2s;
        }
        .drone-card:hover { border-color: #38bdf8; background: rgba(30, 41, 59, 0.9); }
        .drone-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; }
        .drone-type { font-size: 10px; color: #94a3b8; margin-bottom: 6px; }
        .drone-stat { font-size: 10px; color: #cbd5e1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px;}
        .bat-bg { width: 100%; height: 4px; background: #334155; margin-top: 4px; border-radius: 2px; overflow: hidden; }
        .bat-fill { height: 100%; background: #4ade80; transition: width 0.3s; }

        /* Custom Map Markers & Animations */
        @keyframes radarPulse {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(2.0); opacity: 0; }
        }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .base-station {
            background-color: #450a0a; color: #fca5a5; border: 2px solid #ef4444;
            box-shadow: 0 0 15px 5px rgba(239, 68, 68, 0.8); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;
        }
        .drone-icon-container { position: relative; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; }
        
        /* Transparent Radar Effect */
        .scanner-ring {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 50%; 
            background: rgba(56, 189, 248, 0.05);
            pointer-events: none; animation: radarPulse 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }
        
        .civilian-marker {
            background: #ef4444; border: 2px solid #fff; border-radius: 50%;
            width: 12px !important; height: 12px !important; animation: pulseRed 1.5s infinite;
        }
        .obstacle-marker {
            background: #f97316; border: 2px solid #ea580c; border-radius: 50%;
            width: 20px !important; height: 20px !important; box-shadow: 0 0 10px rgba(249, 115, 22, 0.6);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="left-panel">
        <h3 style="margin:0 0 10px 0; color:#38bdf8; text-transform:uppercase; font-size:14px;">Fleet Telemetry</h3>
        <div id="drone-list" style="overflow-y: auto; flex-grow: 1;"></div>
    </div>

    <div id="terminal-panel">
        <div style="color:#facc15; font-weight:bold; margin-bottom:5px;">[SYSTEM INITIALIZED] Awaiting deployment...</div>
        <div id="terminal-out"></div>
    </div>

    <div class="top-bar-controls">
        <button id="btn-obstacle" class="btn">Drop Obstacle: OFF</button>
        <button id="btn-weather" class="btn">Weather Setup</button>
    </div>

    <div id="weather-panel">
        <div class="weather-close" onclick="document.getElementById('weather-panel').style.display='none'">X</div>
        <h4 style="margin:0 0 10px 0; color:#38bdf8;">Environment Settings</h4>
        <div class="weather-opt"><input type="radio" name="wx" value="CLEAR" checked> Clear (Normal Drain)</div>
        <div class="weather-opt"><input type="radio" name="wx" value="RAIN"> Heavy Rain (+30% Drain)</div>
        <div class="weather-opt"><input type="radio" name="wx" value="STORM"> Storm (Restricts Pathing)</div>
    </div>

<script>
    // System Constants
    const BASE_LOC = [13.0600, 80.2650]; // Chennai
    const LOG_CAP = 30;
    
    // Global State
    let obstacleMode = false;
    let weatherEnv = { type: 'CLEAR', mult: 1.0 };
    let gridLayers = [];
    let obstacles = [];
    let survivors = [
        { id: 'S1', coords: [13.0850, 80.2900], detected: false, served: false, marker: null },
        { id: 'S2', coords: [13.0400, 80.2500], detected: false, served: false, marker: null }
    ];

    // Initialize Map with specified OpenFreeMap Dark Style
    const map = L.map('map', { zoomControl: false }).setView(BASE_LOC, 12);
    L.maplibreGL({
        style: 'https://tiles.openfreemap.org/styles/dark',
        attribution: '© OpenFreeMap'
    }).addTo(map);

    // Base Station marker
    L.marker(BASE_LOC, {
        icon: L.divIcon({ className: 'base-station', html: 'H', iconSize: [36, 36] })
    }).addTo(map);

    // Define Irregular Coastal Polygon (Chennai coastal simulation zone)
    const disasterZoneCoords = [
        [80.2500, 13.1100], [80.2950, 13.1100], // North
        [80.3000, 13.0800], [80.2900, 13.0400], [80.2750, 13.0100], // Coastline hugging
        [80.2300, 13.0100], [80.2100, 13.0600], [80.2500, 13.1100] // Inland border
    ];
    const disasterPolygon = turf.polygon([disasterZoneCoords]);

    // Drone Definitions
    const drones = [
        { id: 1, type: 'Scanner', state: 'IDLE', coords: [...BASE_LOC], bat: 100, targetPoly: null, path: [], pathIdx: 0, marker: null },
        { id: 2, type: 'Scanner', state: 'IDLE', coords: [...BASE_LOC], bat: 100, targetPoly: null, path: [], pathIdx: 0, marker: null },
        { id: 3, type: 'Scanner', state: 'IDLE', coords: [...BASE_LOC], bat: 100, targetPoly: null, path: [], pathIdx: 0, marker: null },
        { id: 4, type: 'Scanner', state: 'IDLE', coords: [...BASE_LOC], bat: 100, targetPoly: null, path: [], pathIdx: 0, marker: null },
        { id: 5, type: 'Supplier', state: 'IDLE', coords: [...BASE_LOC], bat: 100, target: null, path: [], pathIdx: 0, marker: null }
    ];

    // --- UI Interactions ---
    function logMsg(msg) {
        const out = document.getElementById('terminal-out');
        const time = new Date().toLocaleTimeString();
        out.insertAdjacentHTML('afterbegin', `<div class="term-entry"><span class="term-time">[${time}]</span> ${msg}</div>`);
        if(out.children.length > LOG_CAP) out.lastChild.remove();
    }

    document.getElementById('btn-weather').addEventListener('click', () => {
        const p = document.getElementById('weather-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    });

    document.querySelectorAll('input[name="wx"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            weatherEnv.type = e.target.value;
            weatherEnv.mult = e.target.value === 'RAIN' ? 1.3 : (e.target.value === 'STORM' ? 1.6 : 1.0);
            logMsg(`Weather updated to ${weatherEnv.type}. Battery drain multiplier: ${weatherEnv.mult}x`);
        });
    });

    const obsBtn = document.getElementById('btn-obstacle');
    obsBtn.addEventListener('click', () => {
        obstacleMode = !obstacleMode;
        obsBtn.classList.toggle('active');
        obsBtn.innerText = `Drop Obstacle: ${obstacleMode ? 'ON' : 'OFF'}`;
        document.getElementById('map').style.cursor = obstacleMode ? 'crosshair' : '';
    });

    map.on('click', (e) => {
        if (!obstacleMode) return;
        const coords = [e.latlng.lat, e.latlng.lng];
        obstacles.push(coords);
        L.marker(coords, { icon: L.divIcon({ className: 'obstacle-marker' }) }).addTo(map);
        logMsg(`Obstacle dropped at [${coords[0].toFixed(4)}, ${coords[1].toFixed(4)}]`);
    });

    function panToDrone(id) {
        const d = drones.find(dr => dr.id === id);
        if (d && d.state !== 'IDLE' && d.state !== 'CHARGING') map.setView(d.coords, 14);
    }

    // 2D Quadcopter Generation
    function generateDroneIcon(drone) {
        const isScanner = drone.type === 'Scanner';
        const color = isScanner ? '#38bdf8' : '#facc15';
        
        // ONLY scanners get the radio wave effect
        const ring = (isScanner && (drone.state === 'SWEEPING' || drone.state === 'DEPLOYING')) 
            ? `<div class="scanner-ring"></div>` : '';
        
        return L.divIcon({
            className: 'drone-icon-container',
            html: `
                ${ring}
                <svg width="40" height="40" viewBox="0 0 100 100" style="z-index: 5; position: absolute;">
                    <!-- Propeller arms -->
                    <ellipse cx="22" cy="22" rx="16" ry="6" fill="#64748b" transform="rotate(-45 22 22)"/>
                    <ellipse cx="78" cy="22" rx="16" ry="6" fill="#64748b" transform="rotate(45 78 22)"/>
                    <ellipse cx="22" cy="78" rx="16" ry="6" fill="#64748b" transform="rotate(45 22 78)"/>
                    <ellipse cx="78" cy="78" rx="16" ry="6" fill="#64748b" transform="rotate(-45 78 78)"/>
                    
                    <!-- Motor hubs -->
                    <circle cx="22" cy="22" r="8" fill="#334155"/>
                    <circle cx="78" cy="22" r="8" fill="#334155"/>
                    <circle cx="22" cy="78" r="8" fill="#334155"/>
                    <circle cx="78" cy="78" r="8" fill="#334155"/>
                    
                    <!-- Frame joining arms -->
                    <path d="M 22 22 L 78 78 M 78 22 L 22 78" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
                    
                    <!-- Main Body -->
                    <circle cx="50" cy="50" r="22" fill="${color}" stroke="#ffffff" stroke-width="3"/>
                    
                    <!-- Number Center -->
                    <text x="50" y="55" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">${drone.id}</text>
                </svg>`,
            iconSize: [44, 44], iconAnchor: [22, 22]
        });
    }

    function createPopupContent(drone) {
        let workPct = 0;
        if (drone.path.length > 0) workPct = Math.round((drone.pathIdx / drone.path.length) * 100);
        const estTime = Math.round((drone.bat / (0.05 * weatherEnv.mult)) / 60);

        return `
            <div style="font-family:sans-serif; color:#0f172a;">
                <b>${drone.type} ${drone.id}</b><br>
                Status: ${drone.state}<br>
                Alt: ${drone.state === 'IDLE' || drone.state === 'CHARGING' ? '0m' : '120m'}<br>
                Battery: ${drone.bat.toFixed(1)}%<br>
                Est. Flight Time: ${estTime}m<br>
                Task Completion: ${workPct}%
            </div>`;
    }

    function updateLeftPanel() {
        let html = '';
        drones.forEach(d => {
            let workPct = d.path.length > 0 ? Math.round((d.pathIdx / d.path.length) * 100) : 0;
            let batColor = d.bat > 50 ? '#4ade80' : (d.bat > 20 ? '#facc15' : '#ef4444');
            html += `
                <div class="drone-card" onclick="panToDrone(${d.id})">
                    <div class="drone-header"><span>${d.type} ${d.id}</span><span style="color:${batColor}">${d.bat.toFixed(1)}%</span></div>
                    <div class="drone-type">${d.state}</div>
                    <div class="drone-stat">
                        <div>Alt: ${d.state === 'IDLE' || d.state === 'CHARGING' ? '0' : '120'}m</div>
                        <div>Task: ${workPct}%</div>
                    </div>
                    <div class="bat-bg"><div class="bat-fill" style="width:${d.bat}%; background:${batColor};"></div></div>
                </div>`;
        });
        document.getElementById('drone-list').innerHTML = html;
    }

    // --- Spatial Logic & Pathfinding ---

    // 1. Dynamic Grid Division based on Active Scanners
    function recalculateGrids() {
        gridLayers.forEach(l => map.removeLayer(l));
        gridLayers = [];

        const activeScanners = drones.filter(d => d.type === 'Scanner' && d.state !== 'RETURNING' && d.state !== 'IDLE' && d.state !== 'CHARGING' && d.bat > 20);
        const n = activeScanners.length;
        
        if (n === 0) {
            logMsg("WARNING: No active scanners available for grid mapping.");
            return;
        }
        
        const bbox = turf.bbox(disasterPolygon);
        const sliceWidth = (bbox[2] - bbox[0]) / n;
        
        activeScanners.forEach((drone, i) => {
            const minLng = bbox[0] + (sliceWidth * i);
            const maxLng = minLng + sliceWidth;
            const sliceBbox = turf.bboxPolygon([minLng, bbox[1], maxLng, bbox[3]]);
            
            const gridPoly = turf.intersect(sliceBbox, disasterPolygon);
            
            if (gridPoly) {
                drone.targetPoly = gridPoly;
                drone.path = generateBoustrophedon(gridPoly);
                drone.pathIdx = 0;
                drone.state = 'DEPLOYING';
                
                const layer = L.geoJSON(gridPoly, { 
                    style: { color: 'rgba(255, 255, 255, 0.5)', weight: 2, fillOpacity: 0.1, fillColor: '#38bdf8' } 
                }).addTo(map);
                gridLayers.push(layer);
            }
        });
    }

    // 2. Boustrophedon Principle
    function generateBoustrophedon(polygon) {
        const bbox = turf.bbox(polygon);
        const step = 0.01;
        const waypoints = [];
        let reverse = false;
        
        for (let lat = bbox[1]; lat <= bbox[3]; lat += step) {
            let row = [];
            for (let lng = bbox[0]; lng <= bbox[2]; lng += step) {
                if (turf.booleanPointInPolygon([lng, lat], polygon)) {
                    row.push([lat, lng]);
                }
            }
            if (row.length > 0) {
                if (reverse) row.reverse();
                waypoints.push(...row);
                reverse = !reverse;
            }
        }
        return waypoints;
    }

    // 3. A* Principle Pathfinding
    function generateAStarPath(start, target) {
        let path = [start];
        let current = [...start];
        const step = 0.005;
        let failsafe = 100;

        while(Math.hypot(current[0]-target[0], current[1]-target[1]) > step && failsafe > 0) {
            failsafe--;
            let dx = target[0] - current[0];
            let dy = target[1] - current[1];
            let dist = Math.hypot(dx, dy);
            
            let nx = current[0] + (dx/dist)*step;
            let ny = current[1] + (dy/dist)*step;

            for(let obs of obstacles) {
                if (Math.hypot(obs[0]-nx, obs[1]-ny) < 0.015) {
                    nx += (obs[1]-ny > 0 ? -step : step);
                    ny += (obs[0]-nx > 0 ? step : -step);
                }
            }
            current = [nx, ny];
            path.push([...current]);
        }
        path.push(target);
        return path;
    }

    // --- Main Simulation Loop ---
    function moveDroneTowards(drone, targetLat, targetLng, speed) {
        const dx = targetLat - drone.coords[0];
        const dy = targetLng - drone.coords[1];
        const dist = Math.hypot(dx, dy);
        
        if (dist < speed) {
            drone.coords = [targetLat, targetLng];
            return true;
        }
        
        drone.coords[0] += (dx/dist) * speed;
        drone.coords[1] += (dy/dist) * speed;
        return false;
    }

    function tick() {
        const speed = 0.0006; // Slowed down speed
        const batDrain = 0.05 * weatherEnv.mult;

        drones.forEach(drone => {
            if (drone.state === 'IDLE') return;

            // Base Charging Logic
            if (drone.state === 'CHARGING') {
                drone.bat += 1.0; 
                if (drone.bat >= 100) {
                    drone.bat = 100;
                    if (drone.type === 'Scanner') {
                        drone.state = 'DEPLOYING';
                        logMsg(`${drone.type} ${drone.id} fully charged. Redeploying.`);
                        setTimeout(recalculateGrids, 100);
                    } else {
                        drone.state = 'IDLE';
                    }
                }
                return;
            }

            drone.bat = Math.max(0, drone.bat - batDrain);

            // 1. Returning Logic
            if (drone.bat <= 20 && drone.state !== 'RETURNING') {
                drone.state = 'RETURNING';
                logMsg(`CRITICAL: ${drone.type} ${drone.id} hit 20% battery. Returning to base.`);
                if (drone.type === 'Scanner') {
                    setTimeout(recalculateGrids, 500);
                }
            }

            if (drone.state === 'RETURNING') {
                const reached = moveDroneTowards(drone, BASE_LOC[0], BASE_LOC[1], speed * 1.5);
                if (reached) {
                    drone.state = 'CHARGING';
                    drone.coords = [...BASE_LOC];
                    if (drone.marker) {
                        map.removeLayer(drone.marker);
                        drone.marker = null;
                    }
                }
            } 
            // 2. Scanner Deployment & Sweeping
            else if (drone.type === 'Scanner') {
                if (drone.path.length > 0 && drone.pathIdx < drone.path.length) {
                    const wp = drone.path[drone.pathIdx];
                    const reached = moveDroneTowards(drone, wp[0], wp[1], speed);
                    
                    if (reached) {
                        if (drone.state === 'DEPLOYING') {
                            drone.state = 'SWEEPING';
                            logMsg(`${drone.type} ${drone.id} entered assigned grid. Commencing sweep.`);
                        }
                        drone.pathIdx++;
                    }

                    // CIVILIAN DETECTION BUG FIXED: Only detects civilians when actively sweeping
                    if (drone.state === 'SWEEPING') {
                        survivors.forEach(surv => {
                            if (!surv.detected && Math.hypot(surv.coords[0]-drone.coords[0], surv.coords[1]-drone.coords[1]) < 0.012) {
                                surv.detected = true;
                                logMsg(`Civilian located by ${drone.type} ${drone.id} at [${surv.coords[0].toFixed(3)}, ${surv.coords[1].toFixed(3)}].`);
                                surv.marker = L.marker(surv.coords, { icon: L.divIcon({ className: 'civilian-marker' }) }).addTo(map);
                                
                                const supplier = drones.find(d => d.type === 'Supplier' && d.state === 'IDLE');
                                if (supplier) {
                                    supplier.state = 'DEPLOYING';
                                    supplier.target = surv;
                                    supplier.path = generateAStarPath(supplier.coords, surv.coords);
                                    supplier.pathIdx = 0;
                                    logMsg(`Supplier ${supplier.id} deploying via A* route.`);
                                }
                            }
                        });
                    }

                } else if (drone.pathIdx >= drone.path.length && drone.state === 'SWEEPING') {
                    if (drone.bat > 20) {
                        logMsg(`${drone.type} ${drone.id} completed grid. Reversing path for continuous sweep.`);
                        drone.pathIdx = 0;
                        drone.path.reverse(); 
                    } else {
                        drone.state = 'RETURNING';
                        logMsg(`${drone.type} ${drone.id} completed grid. Returning to charge.`);
                        setTimeout(recalculateGrids, 500);
                    }
                }
            }
            // 3. Supplier Logic
            else if (drone.type === 'Supplier' && drone.state === 'DEPLOYING') {
                if (drone.path.length > 0 && drone.pathIdx < drone.path.length) {
                    const wp = drone.path[drone.pathIdx];
                    const reached = moveDroneTowards(drone, wp[0], wp[1], speed);
                    if (reached) drone.pathIdx++;
                } else {
                    drone.state = 'DELIVERING';
                    logMsg(`Supplier ${drone.id} dropping payload.`);
                    setTimeout(() => {
                        drone.target.served = true;
                        if (drone.target.marker) map.removeLayer(drone.target.marker);
                        drone.state = 'RETURNING';
                        drone.target = null;
                        logMsg(`Supplier ${drone.id} payload delivered. Returning to base.`);
                    }, 2000);
                }
            }

            // Update Map Markers
            if (drone.state !== 'IDLE' && drone.state !== 'CHARGING') {
                if (!drone.marker) {
                    drone.marker = L.marker(drone.coords, { icon: generateDroneIcon(drone) }).addTo(map);
                    drone.marker.bindPopup(() => createPopupContent(drone));
                } else {
                    drone.marker.setLatLng(drone.coords);
                    drone.marker.setIcon(generateDroneIcon(drone)); 
                    if (drone.marker.isPopupOpen()) drone.marker.setPopupContent(createPopupContent(drone));
                }
            }
        });

        updateLeftPanel();
    }

    // Initialize Simulation
    setTimeout(() => {
        logMsg("Initiating area scan protocols...");
        drones.filter(d => d.type === 'Scanner').forEach(d => { d.state = 'DEPLOYING'; d.bat = 100; });
        recalculateGrids();
        
        setInterval(tick, 100);

        // Continuous Civilian Spawner
        setInterval(() => {
            const activeCivs = survivors.filter(s => !s.served);
            if (activeCivs.length < 4) {
                const bbox = turf.bbox(disasterPolygon);
                let found = false;
                let attempts = 0;
                while (!found && attempts < 10) {
                    const lng = bbox[0] + Math.random() * (bbox[2] - bbox[0]);
                    const lat = bbox[1] + Math.random() * (bbox[3] - bbox[1]);
                    if (turf.booleanPointInPolygon([lng, lat], disasterPolygon)) {
                        survivors.push({ id: 'S' + (survivors.length + 1), coords: [lat, lng], detected: false, served: false, marker: null });
                        found = true;
                    }
                    attempts++;
                }
            }
        }, 8000);
    }, 2000);

</script>
