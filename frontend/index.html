<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DroneX Command Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head><body>
<header>
  <b>DroneX</b><span id="tick">Tick 0</span><span id="comms" class="pill ok">COMMS NORMAL</span>
  <span id="conn" class="dot"></span>
  <button id="blackout">Trigger blackout</button><button id="reset">Reset</button>
</header>
<main>
  <div id="map"></div>
  <aside>
    <h3>Commander approvals</h3><div id="pending"><p class="muted">No pending proposals.</p></div>
    <h3>Fleet</h3><div id="fleet"></div>
    <h3>Mission log</h3><div id="log"></div>
  </aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body></html>
